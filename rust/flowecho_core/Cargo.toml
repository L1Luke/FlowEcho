[package]
name = "flowecho_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "flowecho_core"
crate-type = ["rlib", "cdylib"]

[dependencies]
chacha20poly1305 = "0.10"
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
sha2 = "0.10"
thiserror = "1.0"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
